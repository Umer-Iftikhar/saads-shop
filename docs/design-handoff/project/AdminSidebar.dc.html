<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-6a6f3ae5-09e2-40f9-9a42-9e645c79e454/styles.css">
<script src="_ds/organic-6a6f3ae5-09e2-40f9-9a42-9e645c79e454/_ds_bundle.js"></script>
</helmet>
<div style="height: 100%; background: var(--color-neutral-900); color: var(--color-neutral-200); padding: 26px 18px; display: flex; flex-direction: column; gap: 6px; font-family: var(--font-body);">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 26px;">
    <svg width="36" height="36" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="21" fill="#c67139"></circle>
      <path d="M4 30c4 0 4-4 8-4s4 4 8 4 4-4 8-4 4 4 8 4v9H4z" fill="#f5ead8"></path>
      <text x="22" y="24" text-anchor="middle" font-family="Caprasimo, serif" font-size="21" fill="#f5ead8">S</text>
      <circle cx="35" cy="9" r="4" fill="#7a8a5e"></circle>
    </svg>
    <div>
      <div style="font-family: var(--font-heading); font-size: 16px; color: var(--color-neutral-100);">Saad's Shop</div>
      <div style="font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--color-neutral-500);">Shop panel</div>
    </div>
  </div>
  <sc-for list="{{ items }}" as="n" hint-placeholder-count="7">
    <div style="{{ n.style }}">
      <span>{{ n.name }}</span>
      <span style="{{ n.badgeStyle }}">{{ n.badge }}</span>
    </div>
  </sc-for>
  <div style="margin-top: auto; padding: 16px 10px 0; font-size: 12px; color: var(--color-neutral-500);">Saad Iqbal · owner</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:258,&quot;height&quot;:620},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Overview&quot;,&quot;Orders&quot;,&quot;Inventory&quot;,&quot;Products&quot;,&quot;Stitching queue&quot;,&quot;Customers&quot;,&quot;Settings&quot;],&quot;default&quot;:&quot;Overview&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'Overview';
    const defs = [
      ['Overview', ''], ['Orders', '3'], ['Inventory', '2'], ['Products', ''],
      ['Stitching queue', '7'], ['Customers', ''], ['Settings', '']
    ];
    return {
      items: defs.map(d => ({
        name: d[0], badge: d[1],
        style: 'display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; border-radius: 999px; font-size: 14px; cursor: pointer; ' +
          (d[0] === active ? 'background: var(--color-accent); color: var(--color-bg); font-weight: 700;' : 'color: var(--color-neutral-300);'),
        badgeStyle: d[1]
          ? 'font-size: 11px; padding: 1px 9px; border-radius: 999px; background: ' + (d[0] === active ? 'rgba(245,234,216,0.3)' : 'var(--color-accent-2-700)') + '; color: var(--color-accent-2-100);'
          : 'display: none;'
      }))
    };
  }
}

</script>
</body>
</html>
