# Local development dependencies. The app itself runs on the host
# (`dotnet run`, `npm run dev`) — only SQL Server lives in a container.
#
#   docker compose up -d mssql
#   MSSQL_PASSWORD='<the password below>' ./database/apply.sh --demo

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saadsshop-mssql
    environment:
      ACCEPT_EULA: "Y"
      # Development only. Production reads the password from the environment
      # or a secret store and never from a file in the repository.
      MSSQL_SA_PASSWORD: "Sh0p!Rawalpindi#2026"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # The container reports "running" long before SQL Server accepts logins;
      # depending on the port alone gives a race that fails roughly half the
      # time on a cold start.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mssql-data:
