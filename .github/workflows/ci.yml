name: CI

# Every push and every pull request. There are 856 tests in this repository and
# until now nothing ran them except a person remembering to.
on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      #  Fail on a dependency with a published advisory. Two arrived in this
      #  project by ordinary means — SSH.NET through Testcontainers, and an
      #  older ImageSharp — and both were caught by a person happening to read
      #  the restore output. That is not a control.
      - name: Restore, failing on known vulnerabilities
        run: dotnet restore backend/SaadsShop.slnx -warnaserror:NU1901,NU1902,NU1903,NU1904

      # Warnings are the point of building separately: a warning here is a
      # warning a reviewer would otherwise have to notice by eye.
      - name: Build
        run: dotnet build backend/SaadsShop.slnx --no-restore --configuration Release

      - name: Unit tests
        run: >
          dotnet test backend/tests/SaadsShop.UnitTests/SaadsShop.UnitTests.csproj
          --no-build --configuration Release --logger "console;verbosity=normal"

  integration:
    name: Backend — integration tests (real SQL Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Testcontainers starts SQL Server itself; the runner's Docker daemon is
      # all it needs, and GitHub-hosted runners have one. Pulling the image up
      # front keeps the first test's timeout from covering a 1.5GB download.
      - name: Pull SQL Server
        run: docker pull mcr.microsoft.com/mssql/server:2022-latest

      - name: Restore
        run: dotnet restore backend/SaadsShop.slnx

      - name: Integration tests
        run: >
          dotnet test backend/tests/SaadsShop.IntegrationTests/SaadsShop.IntegrationTests.csproj
          --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend — typecheck, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      #  The same idea on the other side. --audit-level=high so a low-severity
      #  advisory in a build-only dependency does not block the shop's work.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      # The same command a contributor runs: typecheck, lint, test, build.
      - name: Check
        run: npm run check

  database:
    name: Database — scripts apply, twice
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Str0ng!Passw0rd2026'
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Str0ng!Passw0rd2026' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - name: Install sqlcmd
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -sSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
          echo '/opt/mssql-tools18/bin' >> "$GITHUB_PATH"

      # Twice, because every script here is meant to be re-runnable: that is how
      # a change to the schema is deployed to a database that already exists,
      # and a guard that only works on an empty database is not a guard.
      - name: Apply to a fresh database
        env:
          MSSQL_PASSWORD: 'Str0ng!Passw0rd2026'
        run: ./database/apply.sh --database SaadsShopCi

      - name: Apply again, over the top
        env:
          MSSQL_PASSWORD: 'Str0ng!Passw0rd2026'
        run: ./database/apply.sh --database SaadsShopCi
